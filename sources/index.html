    const params = new URLSearchParams(window.location.search);
    let country = params.get("country");
    let path = params.get("path");
    const grid = document.getElementById("sourcesGrid");
    const normalize = (value) => value.toLowerCase().replace(/[^a-z0-9]/g, "");

    if (!country && !path && document.referrer) {
      try {
        const referrer = new URL(document.referrer);
        const parts = referrer.pathname.split("/").filter(Boolean);
        const previousFolder = parts.at(-2);
        const inferred = sourceData.find((item) => item.path === previousFolder);
        if (inferred) {
          country = inferred.title;
          path = inferred.path;
        }
      } catch {
        // Keep the full source hub when the referrer cannot be parsed.
      }
    }

    function sourceLabel(url) {
      try {
        const parsed = new URL(url);
        const host = parsed.hostname.replace(/^www\./, "");
        const slug = parsed.pathname.split("/").filter(Boolean).slice(-1)[0] || host;
        return {
          host,
          title: slug.replace(/[-_]/g, " ")
        };
      } catch {
        return {
          host: "Source",
          title: url
        };
      }
    }

    function uniqueLinks(links) {
      const seen = new Set();
      return links.filter((link) => {
        const key = link.replace(/\/$/, "");
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function renderCard(item) {
      const card = document.createElement("section");
      card.className = "source-card source-card-full";
      const links = uniqueLinks(item.links || []);
      card.innerHTML = `
        <div class="source-card-heading">
          <h2>${item.title}</h2>
          <span>${links.length} link${links.length === 1 ? "" : "s"}</span>
        </div>
        ${item.note ? `<p class="source-note">${item.note}</p>` : ""}
      `;

      if (links.length) {
        const list = document.createElement("ol");
        list.className = "source-list";
        links.forEach((url) => {
          const label = sourceLabel(url);
          const row = document.createElement("li");
          const link = document.createElement("a");
          link.href = url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.title = url;
          link.innerHTML = `<strong>${label.host}</strong><span>${label.title}</span>`;
          row.append(link);
          list.append(row);
        });
        card.append(list);
      } else {
        const empty = document.createElement("p");
        empty.className = "source-empty";
        empty.textContent = "Sources for this country are being prepared.";
        card.append(empty);
      }

      if (item.textSources?.length) {
        const textBox = document.createElement("div");
        textBox.className = "text-source-box";
        textBox.innerHTML = `<h3>Additional resources</h3><p>${item.textSources.join(" · ")}</p>`;
        card.append(textBox);
      }
      return card;
    }

    function renderSources(items) {
      grid.replaceChildren(...items.map(renderCard));
    }

    if (country) {
      const selected = sourceData.find((item) =>
        normalize(item.title) === normalize(country) || normalize(item.path) === normalize(path || "")
      );
      document.title = `${country} Sources`;
      document.getElementById("sourcesTitle").textContent = `${country} Sources`;
      document.getElementById("sourcesIntro").textContent =
        selected
          ? `Reports, background resources, and humanitarian updates connected to the ${selected.title} display.`
          : `Sources for ${country} are being prepared.`;
      document.getElementById("countryBackLink").href = path ? `../${path}/index.html` : "../index.html";
      grid.classList.add("sources-grid-focused");
      renderSources(selected ? [selected] : []);
    } else {
      document.getElementById("countryBackLink").remove();
      renderSources(sourceData);
    }
